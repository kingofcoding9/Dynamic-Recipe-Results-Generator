<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursive Recipe Book Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Minecraft-like Button Styles for Preview */
        .mc-button {
            background-color: #3c3c3c;
            color: white;
            border: 2px solid;
            border-color: #5e5e5e #1e1e1e #1e1e1e #5e5e5e;
            transition: background-color 0.1s;
        }
        .mc-button:active {
            border-color: #1e1e1e #5e5e5e #5e5e5e #1e1e1e;
            background-color: #2b2b2b;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

    <div class="container mx-auto px-4 py-8 max-w-6xl flex-grow">
        
        <!-- Header -->
        <header class="mb-8 text-center border-b border-slate-800 pb-8">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-400 mb-2 flex items-center justify-center gap-3">
                <i data-lucide="layers" class="w-10 h-10 text-teal-400"></i>
                Recursive Recipe Book
            </h1>
            <p class="text-slate-400">Generates a Minecraft Script with full <strong>Back/Exit</strong> navigation history.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Controls (4 cols) -->
            <div class="lg:col-span-4 space-y-6">
                <!-- Upload -->
                <div class="bg-slate-900 rounded-xl p-6 border-2 border-dashed border-slate-700 hover:border-teal-500 transition-colors cursor-pointer text-center relative group">
                    <input type="file" id="fileInput" accept=".zip" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="flex flex-col items-center justify-center gap-4 pointer-events-none">
                        <div class="bg-slate-800 p-4 rounded-full group-hover:bg-teal-500/20 group-hover:text-teal-400 transition-colors shadow-lg">
                            <i data-lucide="archive-restore" class="w-8 h-8"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-teal-100">Upload Recipes.zip</h3>
                            <p class="text-xs text-slate-500 mt-1">Parses JSONs & builds dependency tree</p>
                        </div>
                    </div>
                </div>

                <!-- Stats & Download -->
                <div id="statsPanel" class="hidden bg-slate-900 rounded-xl p-6 border border-slate-800 shadow-xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <i data-lucide="file-code-2" class="w-24 h-24"></i>
                    </div>
                    
                    <h3 class="text-xs font-bold text-teal-500 uppercase tracking-widest mb-4">Generation Ready</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-950 p-3 rounded border border-slate-800">
                            <span class="block text-slate-400 text-xs">Recipes</span>
                            <span class="block text-xl font-bold text-white" id="statCount">0</span>
                        </div>
                        <div class="bg-slate-950 p-3 rounded border border-slate-800">
                            <span class="block text-slate-400 text-xs">Links</span>
                            <span class="block text-xl font-bold text-white" id="statLinks">0</span>
                        </div>
                    </div>
                    
                    <button onclick="downloadScript()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-all shadow-lg shadow-teal-900/20 group">
                        <i data-lucide="download" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        Download Script
                    </button>
                    <p class="text-[10px] text-slate-500 text-center mt-3">File: <code>recursive_recipe_book.js</code></p>
                </div>
            </div>

            <!-- Right Column: Visualizer (8 cols) -->
            <div class="lg:col-span-8 space-y-6">
                
                <div id="statusMessage" class="hidden p-4 rounded-lg bg-slate-900 border border-slate-800"></div>

                <!-- Interface Preview -->
                <div id="interfacePanel" class="hidden bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex flex-col h-full min-h-[600px] shadow-2xl">
                    
                    <!-- Sim Header -->
                    <div class="bg-slate-950 p-4 border-b border-slate-800 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <i data-lucide="play-circle" class="w-5 h-5 text-teal-400"></i>
                            <span class="font-semibold text-slate-200">Live Simulation</span>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="simInput" placeholder="Item ID (e.g. os_br:blood_rot_rapier)" 
                                class="bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded px-2 py-1 outline-none focus:border-teal-500 w-64 font-mono">
                            <button onclick="startSimulation()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded text-xs transition-colors border border-slate-700">
                                Open
                            </button>
                        </div>
                    </div>

                    <!-- The Mock Canvas -->
                    <div class="flex-grow bg-[#1a1a1a] relative flex items-center justify-center p-8 overflow-y-auto custom-scroll">
                        
                        <!-- Breadcrumbs for History -->
                        <div class="absolute top-4 left-4 right-4 flex gap-2 overflow-x-auto text-xs font-mono text-slate-500 custom-scroll pb-2" id="simBreadcrumbs">
                            <!-- Injected via JS -->
                        </div>

                        <!-- Form UI -->
                        <div id="mockForm" class="hidden w-full max-w-sm bg-[#c6c6c6] text-[#1f1f1f] border-2 border-[#fff] shadow-[6px_6px_0_0_rgba(0,0,0,0.5)] flex flex-col">
                            
                            <!-- Header -->
                            <div class="bg-[#1f1f1f] text-white p-2 border-b-2 border-[#585858] flex justify-between items-center">
                                <span class="font-bold truncate px-1" id="formTitle">Recipe Title</span>
                                <button onclick="closeMock()" class="text-slate-400 hover:text-white px-1">✕</button>
                            </div>
                            
                            <!-- Content -->
                            <div class="p-4 flex-grow">
                                <div id="formBody" class="font-mono text-sm mb-6 whitespace-pre-wrap leading-snug">Description...</div>

                                <!-- Button List -->
                                <div id="formButtons" class="space-y-1">
                                    <!-- Buttons injected here -->
                                </div>
                            </div>
                        </div>

                        <!-- Empty State -->
                        <div id="emptyState" class="text-center opacity-30">
                            <i data-lucide="gamepad-2" class="w-24 h-24 mx-auto mb-4"></i>
                            <p class="text-sm font-mono">Waiting for input...</p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let recipeDatabase = {};
        let generatedScript = "";
        
        // Simulation State
        let simHistory = []; // Stack of IDs

        // --- Event Listeners ---
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        document.getElementById('simInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startSimulation();
        });

        // --- Logic ---

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            resetUI();
            showStatus('loading', 'Parsing recursive structures...');

            try {
                const zip = new JSZip();
                await zip.loadAsync(file);
                
                recipeDatabase = {};
                const promises = [];
                let linkCount = 0;

                zip.forEach((path, entry) => {
                    if (!entry.dir && entry.name.endsWith('.json') && !entry.name.includes('__MACOSX')) {
                        promises.push(entry.async('string').then(text => {
                            try {
                                const json = JSON.parse(text);
                                const processed = processRecipe(json);
                                if (processed) recipeDatabase[processed.raw_id] = processed;
                            } catch (e) {}
                        }));
                    }
                });

                await Promise.all(promises);

                // Calculate links
                Object.values(recipeDatabase).forEach(r => {
                    r.ingredients_structured.forEach(ing => {
                        if (recipeDatabase[ing.item]) linkCount++;
                    });
                });

                // Stats
                document.getElementById('statCount').textContent = Object.keys(recipeDatabase).length;
                document.getElementById('statLinks').textContent = linkCount;

                // Generate Script
                generatedScript = generateRecursiveScript(recipeDatabase);

                // UI
                document.getElementById('statusMessage').classList.add('hidden');
                document.getElementById('statsPanel').classList.remove('hidden');
                document.getElementById('interfacePanel').classList.remove('hidden');

                // Auto-fill
                const keys = Object.keys(recipeDatabase);
                if (keys.length > 0) document.getElementById('simInput').value = keys[0];

            } catch (err) {
                console.error(err);
                showStatus('error', err.message);
            }
        }

        // --- Recipe Processing ---
        function formatIdentifier(id) {
            if (!id) return "Unknown";
            const parts = id.split(':');
            let name = parts.length > 1 ? parts[1] : parts[0];
            name = name.replace(/_/g, ' ');
            return name.replace(/\b\w/g, c => c.toUpperCase());
        }

        function processRecipe(json) {
            let type = '';
            let root = null;

            if (json['minecraft:recipe_shaped']) { type = 'shaped'; root = json['minecraft:recipe_shaped']; }
            else if (json['minecraft:recipe_shapeless']) { type = 'shapeless'; root = json['minecraft:recipe_shapeless']; }
            else if (json['minecraft:recipe_furnace']) { type = 'furnace'; root = json['minecraft:recipe_furnace']; }
            else return null;

            const rawId = root.description?.identifier || "unknown";
            const niceName = formatIdentifier(rawId);
            
            let station = "Crafting Table";
            if (root.tags?.length > 0) {
                const tag = root.tags.find(t => t !== 'crafting_table') || root.tags[0];
                station = formatIdentifier(tag);
            }

            let ingredients = [];
            if (type === 'shaped') {
                const keyMap = root.key;
                const pattern = root.pattern;
                const counts = {};
                pattern.forEach(row => {
                    for (let char of row) if (char !== ' ') counts[char] = (counts[char] || 0) + 1;
                });
                for (let [char, count] of Object.entries(counts)) {
                    if (keyMap[char]) ingredients.push({ item: keyMap[char].item, count: count });
                }
            } else if (type === 'shapeless') {
                const tempMap = {};
                root.ingredients.forEach(ing => {
                    tempMap[ing.item] = (tempMap[ing.item] || 0) + (ing.count || 1);
                });
                for(let [item, count] of Object.entries(tempMap)) ingredients.push({ item, count });
            } else if (type === 'furnace') {
                ingredients.push({ item: root.input, count: 1 });
            }

            const ingText = ingredients.map(i => `${i.count}x ${formatIdentifier(i.item)}`).join(', ');
            const text = `Station: ${station}\n\nIngredients:\n${ingText}`;

            return {
                raw_id: rawId,
                display_name: niceName,
                crafting_station: station,
                ingredients_structured: ingredients,
                script_text: text
            };
        }

        // --- Simulation Logic (Mirrors the Script) ---
        function startSimulation() {
            simHistory = [];
            const input = document.getElementById('simInput').value.trim();
            if(input) openForm(input);
        }

        function openForm(itemId) {
            const recipe = recipeDatabase[itemId];
            const mockForm = document.getElementById('mockForm');
            const empty = document.getElementById('emptyState');
            const btnContainer = document.getElementById('formButtons');

            empty.classList.add('hidden');
            mockForm.classList.remove('hidden');
            btnContainer.innerHTML = '';
            
            updateBreadcrumbs();

            // 1. Title & Body
            if (!recipe) {
                document.getElementById('formTitle').textContent = "Unknown Item";
                document.getElementById('formBody').textContent = `No custom recipe data for: ${itemId}\n\nIt might be a vanilla item or not in the pack.`;
                
                // If we have history, show back button
                if (simHistory.length > 0) addBackButton(btnContainer);
                addExitButton(btnContainer);
                return;
            }

            document.getElementById('formTitle').textContent = recipe.display_name;
            document.getElementById('formBody').textContent = recipe.script_text;

            // 2. Add Ingredient Buttons (Recursive Links)
            recipe.ingredients_structured.forEach(ing => {
                if (recipeDatabase[ing.item]) {
                    const btn = document.createElement('button');
                    btn.className = "mc-button w-full px-2 py-2 text-sm text-left flex justify-between items-center group";
                    btn.innerHTML = `<span>Recipe: ${formatIdentifier(ing.item)}</span> <i data-lucide="chevron-right" class="w-3 h-3 group-hover:translate-x-1 transition-transform"></i>`;
                    
                    btn.onclick = () => {
                        simHistory.push(itemId); // Push current to history
                        openForm(ing.item); // Open new
                    };
                    btnContainer.appendChild(btn);
                }
            });

            // Spacer
            if (btnContainer.children.length > 0) {
                const hr = document.createElement('div');
                hr.className = "h-px bg-[#585858] my-2";
                btnContainer.appendChild(hr);
            }

            // 3. Back Button (Conditional)
            if (simHistory.length > 0) {
                addBackButton(btnContainer);
            }

            // 4. Exit Button (Always)
            addExitButton(btnContainer);
            
            lucide.createIcons();
        }

        function addBackButton(container) {
            const btn = document.createElement('button');
            btn.className = "mc-button w-full px-2 py-2 text-sm text-center font-bold text-yellow-200";
            btn.textContent = "< Back";
            btn.onclick = () => {
                const prev = simHistory.pop();
                if (prev) openForm(prev);
            };
            container.appendChild(btn);
        }

        function addExitButton(container) {
            const btn = document.createElement('button');
            btn.className = "mc-button w-full px-2 py-2 text-sm text-center text-red-300";
            btn.textContent = "Exit";
            btn.onclick = closeMock;
            container.appendChild(btn);
        }

        function updateBreadcrumbs() {
            const bc = document.getElementById('simBreadcrumbs');
            bc.innerHTML = '';
            simHistory.forEach(id => {
                const span = document.createElement('span');
                span.className = "whitespace-nowrap opacity-50";
                span.textContent = id + " > ";
                bc.appendChild(span);
            });
        }

        function closeMock() {
            document.getElementById('mockForm').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('simBreadcrumbs').innerHTML = '';
            simHistory = [];
        }

        // --- Script Generation ---
        function generateRecursiveScript(db) {
            const dbString = JSON.stringify(db, null, 2);

            return `/**
 * Recursive Recipe Book
 * Generated by Recipe Manager Tool
 * * Usage: 
 * import { showRecipeForm } from "./recursive_recipe_book.js";
 * showRecipeForm(player, "your_namespace:item_id");
 */

import { ActionFormData } from "@minecraft/server-ui";

// --- Database ---
const RECIPE_DB = ${dbString};

/**
 * Shows the recipe form for a specific item.
 * @param {Player} player - The player entity
 * @param {string} itemId - The item identifier (e.g., 'os_br:sword')
 * @param {string[]} history - (Internal) Stack of previous item IDs for navigation
 */
export function showRecipeForm(player, itemId, history = []) {
    if (!player || !itemId) return;

    const form = new ActionFormData();
    const recipe = RECIPE_DB[itemId];
    
    // 1. Header & Body
    if (!recipe) {
        // Handle Missing/Vanilla
        const niceName = formatId(itemId);
        form.title(niceName);
        
        if (itemId.startsWith("minecraft:")) {
            form.body("§eStandard Vanilla Item§r\\n\\nObtained via standard gameplay (Crafting Table, Furnace, etc).");
        } else {
            form.body("§cRecipe Not Found§r\\n\\nNo custom recipe exists for this item.");
        }
    } else {
        // Handle Valid Custom Recipe
        form.title(recipe.display_name);
        
        // Format body text with colors
        let bodyText = recipe.script_text
            .replace("Station:", "§lStation:§r")
            .replace("Ingredients:", "§lIngredients:§r");
            
        form.body(bodyText);
    }

    // 2. Sub-Recipe Buttons
    // These allow drilling down deeper into the recipe tree
    const subButtons = [];
    if (recipe) {
        recipe.ingredients_structured.forEach(ing => {
            if (RECIPE_DB[ing.item]) {
                const name = formatId(ing.item);
                // Store logic to run if clicked
                subButtons.push({
                    text: \`Recipe: \${name}\`,
                    targetId: ing.item
                });
                form.button(\`Recipe: \${name}\`); 
            }
        });
    }

    // 3. Navigation Buttons
    let hasBack = false;
    if (history.length > 0) {
        form.button("§e< Back§r");
        hasBack = true;
    }

    form.button("§cExit§r");

    // 4. Show & Handle
    form.show(player).then(response => {
        if (response.canceled) return;

        let index = response.selection;

        // A. Check if a Sub-Recipe was clicked
        if (index < subButtons.length) {
            const clicked = subButtons[index];
            
            // Push current item to history before moving forward
            const newHistory = [...history, itemId];
            
            // Recursive Call
            showRecipeForm(player, clicked.targetId, newHistory);
            return;
        }

        // Adjust index to account for sub-buttons
        index -= subButtons.length;

        // B. Check Back Button
        if (hasBack) {
            if (index === 0) {
                // Clicked Back
                const prevItem = history[history.length - 1];
                const newHistory = history.slice(0, -1); // Pop
                showRecipeForm(player, prevItem, newHistory);
                return;
            }
            index--; // Skip back button for next check
        }

        // C. Exit (Remaining index)
        // Do nothing, form closes automatically
    });
}

function formatId(id) {
    if (!id) return "Unknown";
    const parts = id.split(':');
    let name = parts.length > 1 ? parts[1] : parts[0];
    name = name.replace(/_/g, ' ');
    return name.replace(/\\b\\w/g, c => c.toUpperCase());
}
`;
        }

        function downloadScript() {
            if (!generatedScript) return;
            const blob = new Blob([generatedScript], { type: "text/javascript" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "recursive_recipe_book.js";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetUI() {
            document.getElementById('statsPanel').classList.add('hidden');
            document.getElementById('interfacePanel').classList.add('hidden');
        }

        function showStatus(type, msg) {
            const el = document.getElementById('statusMessage');
            el.classList.remove('hidden');
            if (type === 'error') {
                el.className = 'p-4 rounded-lg bg-red-900/30 text-red-200 border border-red-800';
            } else {
                el.className = 'p-4 rounded-lg bg-teal-900/30 text-teal-200 border border-teal-800 flex items-center gap-2';
                el.innerHTML = `<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> ${msg}`;
            }
            if (type === 'error') el.textContent = msg;
            lucide.createIcons();
        }
    </script>
</body>
</html>
